<!-- Ledgerworks icon: an isometric factory standing on an open ledger book,
     with a rising green bar chart and a gold coin. Original art, game palette.
     The `pad` group scale lets the same art be drawn with maskable padding. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3346"/><stop offset="1" stop-color="#171b26"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a72"/><stop offset="1" stop-color="#ea6a45"/></linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#e0a81c"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2b8"/><stop offset="1" stop-color="#ffc35a"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="230" r="170" fill="url(#sky)" opacity=".22"/>
  <g id="art" filter="url(#sh)">
    <!-- Open ledger book (iso) -->
    <path d="M256 430 L96 350 L96 330 L256 410 L416 330 L416 350 Z" fill="#c9b48f"/>
    <path d="M256 410 L96 330 L256 250 L256 410 Z" fill="#fffaf0"/>
    <path d="M256 410 L416 330 L256 250 Z" fill="#f1e7d3"/>
    <g stroke="#cdbf9f" stroke-width="3"><path d="M128 330 L240 274"/><path d="M144 346 L248 294"/><path d="M160 362 L248 318"/><path d="M272 274 L384 330"/><path d="M272 298 L368 346"/></g>
    <path d="M256 250 L256 410" stroke="#b39a6c" stroke-width="4"/>
    <!-- Factory: front-left wall, right wall, sawtooth roof -->
    <path d="M150 300 L150 220 L240 265 L240 345 Z" fill="#c8553d"/>
    <path d="M240 345 L240 265 L310 230 L310 310 Z" fill="#9c3f2e"/>
    <path d="M150 220 L176 190 L196 223 L222 193 L240 265 Z" fill="#5d636a"/>
    <path d="M150 220 L176 190 L176 203 Z" fill="#7b828a"/>
    <path d="M176 190 L196 223 L222 193 L240 210 L240 265 L150 220 Z" fill="#4a4f57" opacity=".35"/>
    <path d="M240 265 L222 193 L292 158 L310 230 Z" fill="#6b727b"/>
    <!-- Lit windows -->
    <g fill="url(#glass)"><path d="M164 262 L184 272 L184 296 L164 286 Z"/><path d="M196 278 L216 288 L216 312 L196 302 Z"/><path d="M256 296 L276 286 L276 306 L256 316 Z"/><path d="M286 281 L300 274 L300 294 L286 301 Z"/></g>
    <!-- Chimney + smoke -->
    <path d="M276 172 L296 162 L296 96 L276 106 Z" fill="#b9b3aa"/><path d="M276 106 L296 96 L304 100 L284 110 Z" fill="#d9d4cb"/>
    <path d="M276 140 L296 130" stroke="#e5484d" stroke-width="8"/>
    <circle cx="300" cy="78" r="16" fill="#e6e1d8" opacity=".9"/><circle cx="324" cy="58" r="12" fill="#e6e1d8" opacity=".7"/><circle cx="342" cy="40" r="8" fill="#e6e1d8" opacity=".5"/>
    <!-- Rising bars on the right page -->
    <path d="M330 318 L346 310 L346 270 L330 278 Z" fill="#7ccf4a"/><path d="M354 306 L370 298 L370 240 L354 248 Z" fill="#5fb63a"/><path d="M378 294 L394 286 L394 204 L378 212 Z" fill="#4fa52c"/>
    <!-- Gold coin -->
    <circle cx="140" cy="168" r="44" fill="url(#coin)" stroke="#b07a00" stroke-width="6"/>
    <text x="140" y="186" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="54" fill="#8a5a00">$</text>
  </g>
</svg>
